services:
  code-generator:
    build: .
    container_name: code-generator
    env_file:
      - .env
    volumes:
      - ./config:/app/config:ro
    networks:
      pneumatic:
        aliases:
          - code-generator.local
    restart: unless-stopped

networks:
  pneumatic:
    name: ${PNEUMATIC_NETWORK:-pneumatic_pneumatic}
    external: true
